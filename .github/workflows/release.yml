name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.0.0)'
        required: true
        type: string

jobs:
  build-release:
    name: Build Release
    runs-on: macos-latest
    
    strategy:
      matrix:
        platform: [iOS, macOS]
        include:
          - platform: iOS
            destination: 'generic/platform=iOS'
            archive_path: 'Bookworm-iOS.xcarchive'
            export_method: 'app-store'
          - platform: macOS
            destination: 'generic/platform=macOS'
            archive_path: 'Bookworm-macOS.xcarchive'
            export_method: 'mac-application'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Cache derived data
      uses: actions/cache@v4
      with:
        path: ~/Library/Developer/Xcode/DerivedData
        key: ${{ runner.os }}-derived-data-release-${{ hashFiles('**/project.pbxproj') }}
        restore-keys: |
          ${{ runner.os }}-derived-data-release-
          ${{ runner.os }}-derived-data-

    - name: Archive for ${{ matrix.platform }}
      run: |
        cd Bookworm
        xcodebuild -project Bookworm.xcodeproj \
          -scheme Bookworm \
          -destination '${{ matrix.destination }}' \
          -configuration Release \
          -archivePath ${{ matrix.archive_path }} \
          archive

    - name: Create Export Options
      run: |
        cd Bookworm
        cat > ExportOptions.plist << EOF
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>method</key>
            <string>${{ matrix.export_method }}</string>
            <key>teamID</key>
            <string>\$TEAM_ID</string>
            <key>uploadBitcode</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
            <key>compileBitcode</key>
            <false/>
        </dict>
        </plist>
        EOF

    - name: Export Archive
      run: |
        cd Bookworm
        xcodebuild -exportArchive \
          -archivePath ${{ matrix.archive_path }} \
          -exportPath ./export \
          -exportOptionsPlist ExportOptions.plist
      continue-on-error: true # May fail without proper provisioning profiles

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Bookworm-${{ matrix.platform }}-${{ github.ref_name }}
        path: |
          Bookworm/${{ matrix.archive_path }}
          Bookworm/export/
        retention-days: 30